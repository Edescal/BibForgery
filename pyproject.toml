[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"bibforgery" = [
    "templates/**/*",
    "assets/**/*"
]


[project.scripts]
bibforgery = "bibforgery.cli:main"


[project]
name = "bibforgery"
version = "0.1.21"
description = "Cliente para obtener y procesar datos de Scopus"
authors = [
    { name="Eduardo Escalante" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bibtexparser==2.0.0b9",
    "brotli==1.2.0",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "cssselect2==0.9.0",
    "fonttools==4.62.1",
    "idna==3.11",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "pillow==12.2.0",
    "pycparser==3.0",
    "pydyf==0.12.1",
    "pylatexenc==2.10",
    "pyparsing==3.3.2",
    "pyphen==0.17.2",
    "python-dotenv==1.2.2",
    "requests==2.33.1",
    "tinycss2==1.5.1",
    "tinyhtml5==2.1.0",
    "urllib3==2.6.3",
    "weasyprint==68.1",
    "webencodings==0.5.1",
    "zopfli==0.4.1",
]